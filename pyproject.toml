[project]
name = "nl2sql-agent"
version = "0.5.2"
description = "Production-grade natural-language to SQL data analyst agent with local and cloud LLM support"
readme = "README.md"
requires-python = ">=3.12.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Ahmad" },
]
keywords = ["nlp", "sql", "agent", "ollama", "huggingface", "langgraph", "streamlit", "text2sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LLM providers (LangChain ecosystem)
    "langchain-core>=1.6.0,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-openai>=1.6.0,<2",
    "langchain-google-genai>=4.3.5,<5",
    "langchain-anthropic>=1.6.1,<2",
    # LangGraph workflow
    "langgraph>=1.2.11,<2",
    # Native SDKs used by provider integrations
    "ollama>=0.6.2,<1",
    "openai>=3.3.1,<4",
    "google-genai>=2.19.0,<3",
    # UI
    "streamlit>=1.62.0,<2",
    # Config, validation, logging
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "loguru>=0.7.3,<0.8",
    # SQL safety
    "sqlglot>=30.17.0,<31",
    "psycopg[binary]>=3.3.4,<4",
]

[project.scripts]
nl2sql-agent = "nl2sql_agent.cli:main"

[project.urls]
Repository = "https://github.com/ahmad/natural-language-to-sql-agent"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

# ----- Tooling -----

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # pytest style
    "TID", # tidy imports
    "S",   # flake8-bandit
    "DTZ", # timezone-aware datetimes
    "T10", # debugger calls
    "ERA", # commented-out code
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (Pydantic Field)
    "RUF012", # mutable class attributes
    "PT011", # pytest.raises too broad (we narrow where needed)
    "TID252", # relative imports inside the same package are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806", "RUF043", "S"]

[tool.ruff.lint.isort]
known-first-party = ["nl2sql_agent"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50,<51",
    "pillow>=12.3,<13",
    "pyasn1>=0.6.4,<0.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "integration: marks tests that require external services (Ollama)",
    "slow: marks tests as slow",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/nl2sql_agent"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/ui/streamlit_app.py",
    "*/ui/pages.py",
]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "security" },
]
lint = [
    "ruff>=0.16.4,<0.17",
    "ty>=0.0.73,<0.1",
]
security = [
    "detect-secrets>=1.5.0",
    "prek>=0.4.14",
]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]
