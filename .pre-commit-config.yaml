repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check src
        language: system
        pass_filenames: false
      - id: detect-secrets
        name: detect secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(?:uv\.lock|architecture-diagram\.(?:html|json)|\.ua/|\.codegraph/|\.code-review-graph/|graphify-out/)
