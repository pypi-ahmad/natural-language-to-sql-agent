name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run prek run --all-files
      - run: uv audit --locked
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl nl2sql-agent --help
