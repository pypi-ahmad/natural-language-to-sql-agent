name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q --cov=nl2sql_agent --cov-report=term-missing
      - run: uv run prek run --all-files
      - run: uv audit --locked
      - run: uv build
      - shell: bash
        run: uv run --isolated --no-project --with "$(find dist -name '*.whl' -print -quit)" nl2sql-agent --help

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nl2sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/integration/test_postgres_live.py -q
        env:
          NL2SQL_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:ci-only-password@localhost:5432/nl2sql_test
