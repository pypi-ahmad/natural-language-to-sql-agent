name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q --cov=nl2sql_agent --cov-report=term-missing
      - run: uv run prek run --all-files
      - run: uv audit --locked
      - run: uv build
      - shell: bash
        run: uv run --isolated --no-project --with "$(find dist -name '*.whl' -print -quit)" nl2sql-agent --help

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password # pragma: allowlist secret
          POSTGRES_DB: nl2sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/integration/test_postgres_live.py -q
        env:
          NL2SQL_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:ci-only-password@localhost:5432/nl2sql_test # pragma: allowlist secret
